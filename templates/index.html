<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>思维便签</title>
    <link rel="stylesheet" href="static/style.css">
</head>
<body>
    <!-- ========== 登录/注册页面（默认显示）========== -->
    <div id="auth-page" class="auth-page">
        <div class="auth-brand">
            <img src="static/feather_R.png" class="auth-logo" alt="logo">
            <p class="auth-slogan">让思考留下痕迹</p>
        </div>

        <div class="auth-card">
            <h2 id="auth-title">用户登录</h2>

            <!-- 登录表单 -->
            <div id="login-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="login-username" placeholder="请输入用户名" maxlength="20" onkeydown="if(event.key==='Enter') document.getElementById('login-password').focus()">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="login-password" placeholder="请输入密码" minlength="6" onkeydown="if(event.key==='Enter') handleLogin()">
                </div>
                <button class="auth-submit-btn" onclick="handleLogin()">登录</button>
                <p class="auth-switch">还没有账号？<a href="#" onclick="switchToRegister()">立即注册</a></p>
            </div>

            <!-- 注册表单 -->
            <div id="register-form" style="display: none;">
                <div class="form-group">
                    <label>用户名</label>
                    <input type="text" id="reg-username" placeholder="3-20位字母/数字/下划线" maxlength="20" onkeydown="if(event.key==='Enter') document.getElementById('reg-nickname').focus()">
                    <span class="input-hint">用户名注册后不可修改</span>
                </div>
                <div class="form-group">
                    <label>昵称（可选）</label>
                    <input type="text" id="reg-nickname" placeholder="显示名称，默认同用户名" maxlength="20" onkeydown="if(event.key==='Enter') document.getElementById('reg-password').focus()">
                </div>
                <div class="form-group">
                    <label>密码</label>
                    <input type="password" id="reg-password" placeholder="至少6位密码" minlength="6" onkeydown="if(event.key==='Enter') document.getElementById('reg-password2').focus()">
                </div>
                <div class="form-group">
                    <label>确认密码</label>
                    <input type="password" id="reg-password2" placeholder="再次输入密码" minlength="6" onkeydown="if(event.key==='Enter') handleRegister()">
                </div>
                <button class="auth-submit-btn" onclick="handleRegister()">注册</button>
                <p class="auth-switch">已有账号？<a href="#" onclick="switchToLogin()">直接登录</a></p>
            </div>

            <div id="auth-message" class="auth-message"></div>
        </div>


    </div>

    <!-- ========== 笔记功能页面（登录后显示）========== -->
    <div id="app-page" class="app-page" style="display: none;">
        <div class="container">
            <!-- 用户信息栏 -->
            <div id="user-bar" class="user-bar">
                <input type="file" id="import-file" accept=".md" style="display:none" onchange="handleImport(event)">
                <div class="user-menu-wrapper">
                    <span id="user-avatar" class="user-avatar-trigger" onclick="toggleUserMenu(event)">👤</span>
                    <div id="user-menu" class="user-menu">
                        <div class="user-menu-header">
                            <span id="user-name">用户</span>
                        </div>
                        <div class="user-menu-item" onclick="closeUserMenu(); openExportModal()">导出</div>
                        <div class="user-menu-item" onclick="closeUserMenu(); document.getElementById('import-file').click()">导入</div>
                        <div class="user-menu-item" onclick="closeUserMenu(); openTagManageModal()">标签管理</div>
                        <div class="user-menu-item" onclick="closeUserMenu(); openSettingsModal()">设置</div>
                        <div class="user-menu-item logout" onclick="closeUserMenu(); logout()">退出</div>
                    </div>
                </div>
            </div>

            <h1>思维便签</h1>
        
        <div class="tab-buttons">
            <button id="btn-record" class="tab-btn active" onclick="showTab('record')">记录</button>
            <button id="btn-review" class="tab-btn" onclick="showTab('review')">回顾</button>
        </div>
        
        <!-- 记录面板 -->
        <div id="record-panel" class="panel active">
            <div class="input-group">
                <textarea id="note-input" placeholder="在此记录你的想法..." rows="6"></textarea>
            </div>
            
            <!-- 标签选择区域 -->
            <div class="tag-section">
                <div class="tag-input-row">
                    <div class="tag-input-wrapper">
                        <input type="text" id="tag-input" class="tag-input" placeholder="添加标签" oninput="onTagInputChange()" onkeydown="handleTagInputKeydown(event)">
                        <span id="tag-add-btn" class="tag-add-btn" onclick="addTagFromInput()">添加</span>
                    </div>
                    <div class="tag-dropdown-wrapper">
                        <button class="tag-dropdown-btn" onclick="toggleTagDropdown(event)">
                            <span>选择标签</span>
                            <svg viewBox="0 0 24 24" width="14" height="14" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
                        </button>
                        <div id="tag-dropdown" class="tag-dropdown-content">
                            <p class="tag-dropdown-empty">暂无标签</p>
                        </div>
                    </div>
                </div>
                <div id="selected-tags" class="selected-tags"></div>
            </div>
            
            <div class="record-controls">
                <button class="action-btn" onclick="submitNote()">记录</button>
                <button id="input-mode-btn" class="mode-toggle-btn" 
                        onclick="handleModeButtonClick()"
                        onmousedown="handleModeButtonPress()" 
                        onmouseup="handleModeButtonRelease()"
                        onmouseleave="handleModeButtonRelease()"
                        ontouchstart="handleModeButtonPress()"
                        ontouchend="handleModeButtonRelease()">
                    <svg id="keyboard-icon" class="mode-icon-svg" viewBox="0 0 24 24" fill="currentColor">
                        <!-- 2行3列键盘 - 小圆点 -->
                        <rect x="5.5" y="5.5" width="2.5" height="2.5" rx="0.5"/>
                        <rect x="10" y="5.5" width="2.5" height="2.5" rx="0.5"/>
                        <rect x="14.5" y="5.5" width="2.5" height="2.5" rx="0.5"/>
                        <rect x="5.5" y="10.5" width="2.5" height="2.5" rx="0.5"/>
                        <rect x="10" y="10.5" width="2.5" height="2.5" rx="0.5"/>
                        <rect x="14.5" y="10.5" width="2.5" height="2.5" rx="0.5"/>
                        <!-- 底部空格键 - 改细 -->
                        <rect x="5.5" y="16" width="12.5" height="2" rx="0.5"/>
                    </svg>
                    <svg id="voice-ready-icon" class="mode-icon-svg hidden" viewBox="0 0 24 24" fill="currentColor">
                        <path d="M12 14c1.66 0 3-1.34 3-3V5c0-1.66-1.34-3-3-3S9 3.34 9 5v6c0 1.66 1.34 3 3 3z"/>
                        <path d="M17 11c0 2.76-2.24 5-5 5s-5-2.24-5-5H5c0 3.53 2.61 6.43 6 6.92V21h2v-3.08c3.39-.49 6-3.39 6-6.92h-2z"/>
                    </svg>
                    <svg id="voice-recording-icon" class="mode-icon-svg hidden" viewBox="0 0 24 24" fill="currentColor">
                        <circle cx="12" cy="12" r="3"/>
                        <circle cx="12" cy="12" r="6" fill="none" stroke="currentColor" stroke-width="1.5"/>
                        <circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1"/>
                    </svg>
                </button>
            </div>
            <div id="voice-hint" class="voice-hint"></div>
            <div id="record-message" class="message"></div>
        </div>
        
        <!-- 回顾面板 -->
        <div id="review-panel" class="panel">
            <div class="filter-section">
                <div class="filter-label">时间范围:</div>
                <div class="quick-filters">
                    <button class="quick-btn" onclick="setTimeFilter('today')">当天</button>
                    <button class="quick-btn" onclick="setTimeFilter('3days')">近3天</button>
                    <button class="quick-btn" onclick="setTimeFilter('week')">近7天</button>
                    <button class="quick-btn" onclick="setTimeFilter('all')">全部</button>
                </div>
            </div>
            
            <div class="filter-section">
                <div class="filter-label">状态筛选:</div>
                <div class="status-filters">
                    <button class="status-btn active" onclick="setStatusFilter('全部')">全部</button>
                    <button class="status-btn" onclick="setStatusFilter('待处理')">待处理</button>
                    <button class="status-btn" onclick="setStatusFilter('已处理')">已处理</button>
                </div>
            </div>
            
            <div class="filter-section">
                <div class="filter-label">标签筛选:</div>
                <div class="tag-filters" id="tag-filters">
                    <button class="tag-btn active" onclick="setTagFilter('全部')">全部</button>
                </div>
            </div>
            
            <div class="batch-actions" id="batch-actions" style="display: none;">
                <span class="batch-info">已选择 <span id="selected-count">0</span> 条</span>
                <button class="batch-btn" onclick="batchSetStatus('已处理')">标记为已处理</button>
                <button class="batch-btn" onclick="batchSetStatus('待处理')">标记为待处理</button>
                <div class="batch-tag-dropdown-wrapper">
                    <button class="batch-btn" onclick="toggleBatchTagDropdown(event)">添加标签 ▾</button>
                    <div id="batch-tag-dropdown" class="batch-tag-dropdown">
                        <p class="batch-tag-empty">暂无标签</p>
                    </div>
                </div>
                <button class="batch-btn delete" onclick="batchDelete()">删除</button>
                <button class="batch-btn cancel" onclick="cancelBatch()">取消选择</button>
            </div>
            
            <div id="notes-list" class="notes-list">
                <p class="empty-tip">请选择时间范围查看想法</p>
            </div>
        </div>
    </div>
    </div>

    <!-- ========== 导出弹窗 ========== -->
    <div id="export-modal" class="modal-overlay" style="display:none">
        <div class="modal-card">
            <h3>导出笔记</h3>
            <div class="modal-body">
                <div class="form-group">
                    <label>时间范围</label>
                    <div class="export-time-filters">
                        <button class="export-time-btn active" data-range="all" onclick="setExportTimeRange('all', this)">全部</button>
                        <button class="export-time-btn" data-range="today" onclick="setExportTimeRange('today', this)">当前</button>
                        <button class="export-time-btn" data-range="3days" onclick="setExportTimeRange('3days', this)">近3天</button>
                        <button class="export-time-btn" data-range="week" onclick="setExportTimeRange('week', this)">近一周</button>
                        <span class="export-custom-label">自定义</span>
                        <input type="number" id="export-custom-days" class="export-custom-input" placeholder="天数" min="1" max="3650" oninput="setExportTimeRange('custom', null)">
                    </div>
                </div>
                <div class="form-group">
                    <label>标签选择</label>
                    <div id="export-tags-list" class="export-tags-list">
                        <label class="export-tag-item"><input type="checkbox" value="all" checked onchange="onExportTagAllChange()"> 全部</label>
                    </div>
                </div>
                <div id="export-preview" class="export-preview">将导出 0 条记录</div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeExportModal()">取消</button>
                <button class="modal-btn confirm" onclick="doExport()">导出</button>
            </div>
        </div>
    </div>

    <!-- ========== 标签管理弹窗 ========== -->
    <div id="tag-manage-modal" class="modal-overlay" style="display:none">
        <div class="modal-card tag-manage-card">
            <h3>标签管理</h3>
            <div class="modal-body">
                <div class="tag-manage-add-row">
                    <input type="text" id="tag-manage-new-input" class="tag-manage-input" placeholder="输入新标签名称" onkeydown="if(event.key==='Enter') tagManageAdd()">
                    <button class="modal-btn confirm" onclick="tagManageAdd()">新增</button>
                </div>
                <div id="tag-manage-list" class="tag-manage-list">
                    <p class="empty-tip">暂无标签</p>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeTagManageModal()">关闭</button>
            </div>
        </div>
    </div>

    <!-- ========== 设置弹窗 ========== -->
    <div id="settings-modal" class="modal-overlay" style="display:none">
        <div class="modal-card">
            <h3>设置</h3>
            <div class="modal-body">
                <div class="form-group">
                    <label>登录超时时间</label>
                    <div class="settings-timeout-options">
                        <button class="settings-timeout-btn" data-value="1800" onclick="selectTimeoutPreset(this)">30分钟</button>
                        <button class="settings-timeout-btn" data-value="14400" onclick="selectTimeoutPreset(this)">4小时</button>
                        <button class="settings-timeout-btn" data-value="86400" onclick="selectTimeoutPreset(this)">1天</button>
                        <button class="settings-timeout-btn" data-value="604800" onclick="selectTimeoutPreset(this)">7天</button>
                    </div>
                    <div class="settings-custom-row">
                        <span class="settings-custom-label">自定义</span>
                        <input type="number" id="settings-custom-value" class="settings-custom-input" placeholder="数字" min="1" oninput="selectTimeoutCustom()">
                        <select id="settings-custom-unit" class="settings-custom-select" onchange="selectTimeoutCustom()">
                            <option value="60">分钟</option>
                            <option value="3600">小时</option>
                            <option value="86400">天</option>
                        </select>
                    </div>
                    <div id="settings-current-timeout" class="settings-current"></div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="modal-btn cancel" onclick="closeSettingsModal()">取消</button>
                <button class="modal-btn confirm" onclick="saveSettings()">保存</button>
            </div>
        </div>
    </div>

    <script>
        // ==================== 用户登录相关 ====================
        let currentUser = null;
        const DEFAULT_TIMEOUT = 3 * 24 * 3600; // 默认3天（秒）

        // 获取当前用户的超时时间（秒）
        function getTimeoutSeconds() {
            const openid = localStorage.getItem('openid');
            if (!openid) return DEFAULT_TIMEOUT;
            const stored = localStorage.getItem('timeout_' + openid);
            return stored ? parseInt(stored) : DEFAULT_TIMEOUT;
        }

        // 检查是否已登录，控制页面显示
        function checkLogin() {
            const openid = localStorage.getItem('openid');
            const userInfo = localStorage.getItem('userInfo');
            const loginTime = localStorage.getItem('loginTime');

            if (openid && userInfo) {
                // 检查是否超时
                if (loginTime) {
                    const elapsed = (Date.now() - parseInt(loginTime)) / 1000;
                    const timeout = getTimeoutSeconds();
                    if (elapsed > timeout) {
                        // 已超时，清除登录状态
                        localStorage.removeItem('openid');
                        localStorage.removeItem('userInfo');
                        localStorage.removeItem('loginTime');
                        showAuthPage();
                        return false;
                    }
                }
                currentUser = JSON.parse(userInfo);
                currentUser.openid = openid;
                showAppPage();
                return true;
            } else {
                showAuthPage();
                return false;
            }
        }

        // 显示登录页
        function showAuthPage() {
            document.getElementById('auth-page').style.display = 'flex';
            document.getElementById('app-page').style.display = 'none';
        }

        // 显示应用页
        function showAppPage() {
            document.getElementById('auth-page').style.display = 'none';
            document.getElementById('app-page').style.display = 'block';
            document.getElementById('user-name').textContent = currentUser.nickname || currentUser.username || '用户';
            loadExistingTags();
        }

        // 切换到登录
        function switchToLogin() {
            document.getElementById('auth-title').textContent = '用户登录';
            document.getElementById('login-form').style.display = 'block';
            document.getElementById('register-form').style.display = 'none';
            clearAuthMessage();
        }

        // 切换到注册
        function switchToRegister() {
            document.getElementById('auth-title').textContent = '用户注册';
            document.getElementById('login-form').style.display = 'none';
            document.getElementById('register-form').style.display = 'block';
            clearAuthMessage();
        }

        // 显示认证消息
        function showAuthMessage(text, type) {
            const msgEl = document.getElementById('auth-message');
            msgEl.textContent = text;
            msgEl.className = 'auth-message ' + (type || '');
        }

        function clearAuthMessage() {
            const msgEl = document.getElementById('auth-message');
            msgEl.textContent = '';
            msgEl.className = 'auth-message';
        }

        // 登录处理
        async function handleLogin() {
            const username = document.getElementById('login-username').value.trim();
            const password = document.getElementById('login-password').value;

            if (!username || !password) {
                showAuthMessage('请输入用户名和密码', 'error');
                return;
            }

            try {
                const res = await fetch('api/web-login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password })
                });
                const data = await res.json();

                if (res.ok) {
                    // 保存登录信息
                    localStorage.setItem('openid', data.openid);
                    localStorage.setItem('userInfo', JSON.stringify(data));
                    localStorage.setItem('loginTime', Date.now().toString());
                    currentUser = data;
                    currentUser.openid = data.openid;

                    showAppPage();
                } else {
                    showAuthMessage(data.error || '登录失败', 'error');
                }
            } catch (err) {
                showAuthMessage('网络错误，请重试', 'error');
            }
        }

        // 注册处理
        async function handleRegister() {
            const username = document.getElementById('reg-username').value.trim();
            const nickname = document.getElementById('reg-nickname').value.trim();
            const password = document.getElementById('reg-password').value;
            const password2 = document.getElementById('reg-password2').value;

            // 前端校验
            if (!username || !password) {
                showAuthMessage('用户名和密码不能为空', 'error');
                return;
            }
            if (username.length < 3 || username.length > 20) {
                showAuthMessage('用户名长度需在3-20位之间', 'error');
                return;
            }
            if (!/^[a-zA-Z0-9_]+$/.test(username)) {
                showAuthMessage('用户名只能包含字母、数字和下划线', 'error');
                return;
            }
            if (password.length < 6) {
                showAuthMessage('密码长度不能少于6位', 'error');
                return;
            }
            if (password !== password2) {
                showAuthMessage('两次输入的密码不一致', 'error');
                return;
            }

            try {
                const res = await fetch('api/register', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ username, password, nickname })
                });
                const data = await res.json();

                if (res.ok) {
                    showAuthMessage('注册成功！请登录', 'success');
                    // 清空表单
                    document.getElementById('reg-username').value = '';
                    document.getElementById('reg-nickname').value = '';
                    document.getElementById('reg-password').value = '';
                    document.getElementById('reg-password2').value = '';
                    setTimeout(() => {
                        switchToLogin();
                    }, 1000);
                } else {
                    showAuthMessage(data.error || '注册失败', 'error');
                }
            } catch (err) {
                showAuthMessage('网络错误，请重试', 'error');
            }
        }

        // 退出登录
        function logout() {
            if (!confirm('确定要退出登录吗？')) return;

            localStorage.removeItem('openid');
            localStorage.removeItem('userInfo');
            localStorage.removeItem('loginTime');
            currentUser = null;
            showAuthPage();
        }

        // ==================== 用户下拉菜单 ====================
        function toggleUserMenu(e) {
            e.stopPropagation();
            document.getElementById('user-menu').classList.toggle('show');
        }

        function closeUserMenu() {
            document.getElementById('user-menu').classList.remove('show');
        }

        // 点击页面其他地方关闭用户菜单
        document.addEventListener('click', function(e) {
            const menu = document.getElementById('user-menu');
            if (menu && menu.classList.contains('show')) {
                if (!e.target.closest('.user-menu-wrapper')) {
                    menu.classList.remove('show');
                }
            }
        });

        // ==================== 原有笔记功能 ====================
        let currentTimeFilter = null;
        let currentStatusFilter = '全部';
        let currentTagFilter = '全部';
        let selectedNotes = new Set();
        let currentNotes = [];
        let hasTimeFilterSelected = false;
        let selectedTags = new Set();  // 记录页已选标签
        let existingTags = [];         // 当前用户已有标签列表
        let currentInputMode = 'keyboard'; // 'keyboard' 或 'voice-ready'
        let recognition = null;
        let isRecording = false;
        let finalTranscript = '';
        let interimTranscript = '';
        let pressTimer = null;
        let isLongPress = false;
        const LONG_PRESS_DURATION = 500;
        let preRecordText = ''; // 录音前的原始文本
        let refreshInterval = null; // 定时刷新输入框
        let recordingStartTime = null; // 录音开始时间

        // 页面加载时检查登录状态
        window.addEventListener('DOMContentLoaded', checkLogin);

        // 获取请求头（包含用户openid）
        function getHeaders() {
            const headers = {
                'Content-Type': 'application/json'
            };
            const openid = localStorage.getItem('openid');
            if (openid) {
                headers['X-User-Openid'] = openid;
            }
            return headers;
        }
        const MAX_RECORDING_TIME = 30000; // 最大录音时间30秒

        // 初始化语音识别
        function initSpeechRecognition() {
            if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
                recognition = new SpeechRecognition();
                recognition.continuous = true;
                recognition.interimResults = true;
                recognition.lang = 'zh-CN';
                
                recognition.onstart = function() {
                    // 录音已开始，状态已在 startRecording 中设置
                    console.log('语音识别已开始');
                };
                
                recognition.onresult = function(event) {
                    let tempInterim = '';
                    let newFinal = '';
                    
                    for (let i = event.resultIndex; i < event.results.length; i++) {
                        const transcript = event.results[i][0].transcript;
                        if (event.results[i].isFinal) {
                            newFinal += transcript;
                        } else {
                            tempInterim += transcript;
                        }
                    }
                    
                    // 累加最终结果（不要覆盖，是累加）
                    finalTranscript += newFinal;
                    interimTranscript = tempInterim;
                    
                    // 立即更新输入框
                    updateTextareaWithTranscript();
                };
                
                recognition.onerror = function(event) {
                    console.error('语音识别错误:', event.error);
                    if (event.error === 'not-allowed') {
                        alert('请允许使用麦克风权限');
                    }
                    stopRecording();
                };
                
                recognition.onend = function() {
                    if (!isRecording) {
                        // 录音已停止，清除定时器
                        clearInterval(refreshInterval);
                        refreshInterval = null;
                        // 最终更新
                        updateTextareaWithTranscript();
                        interimTranscript = '';
                        showVoiceReadyState();
                    } else {
                        // 录音中意外结束，自动重启
                        try {
                            recognition.start();
                        } catch (e) {
                            console.error('重启语音识别失败:', e);
                        }
                    }
                };
                
                return true;
            } else {
                alert('您的浏览器不支持语音识别功能，请使用 Chrome 或 Edge 浏览器');
                return false;
            }
        }

        // 更新输入框显示识别内容
        function updateTextareaWithTranscript() {
            const textarea = document.getElementById('note-input');
            const hasContent = finalTranscript || interimTranscript;
            const separator = preRecordText && hasContent ? ' ' : '';
            const newValue = preRecordText + separator + finalTranscript + interimTranscript;
            
            textarea.value = newValue;
            // 滚动到底部
            textarea.scrollTop = textarea.scrollHeight;
        }

        // 处理模式按钮点击（短按切换）
        function handleModeButtonClick() {
            if (!isLongPress) {
                if (currentInputMode === 'keyboard') {
                    switchToVoiceMode();
                } else {
                    switchToKeyboardMode();
                }
            }
        }

        // 处理模式按钮按下
        function handleModeButtonPress() {
            isLongPress = false;
            pressTimer = setTimeout(() => {
                isLongPress = true;
                if (currentInputMode === 'voice-ready' && !isRecording) {
                    startRecording();
                }
            }, LONG_PRESS_DURATION);
        }

        // 处理模式按钮释放
        function handleModeButtonRelease() {
            clearTimeout(pressTimer);
            if (isLongPress && isRecording) {
                stopRecording();
            }
        }

        // 切换到键盘模式
        function switchToKeyboardMode() {
            currentInputMode = 'keyboard';
            document.getElementById('keyboard-icon').classList.remove('hidden');
            document.getElementById('voice-ready-icon').classList.add('hidden');
            document.getElementById('voice-recording-icon').classList.add('hidden');
            document.getElementById('input-mode-btn').classList.remove('voice-mode');
            document.getElementById('voice-hint').textContent = '';
        }

        // 切换到语音准备模式
        function switchToVoiceMode() {
            currentInputMode = 'voice-ready';
            document.getElementById('keyboard-icon').classList.add('hidden');
            document.getElementById('voice-ready-icon').classList.remove('hidden');
            document.getElementById('voice-recording-icon').classList.add('hidden');
            document.getElementById('input-mode-btn').classList.add('voice-mode');
            document.getElementById('voice-hint').textContent = '长按开始语音输入';
            
            if (!recognition) {
                initSpeechRecognition();
            }
        }

        // 显示录音中状态
        function showRecordingState() {
            document.getElementById('keyboard-icon').classList.add('hidden');
            document.getElementById('voice-ready-icon').classList.add('hidden');
            document.getElementById('voice-recording-icon').classList.remove('hidden');
            document.getElementById('input-mode-btn').classList.add('recording');
            document.getElementById('voice-hint').textContent = '正在聆听，松开结束';
        }

        // 显示语音准备状态
        function showVoiceReadyState() {
            document.getElementById('keyboard-icon').classList.add('hidden');
            document.getElementById('voice-ready-icon').classList.remove('hidden');
            document.getElementById('voice-recording-icon').classList.add('hidden');
            document.getElementById('input-mode-btn').classList.remove('recording');
            document.getElementById('voice-hint').textContent = '长按开始语音输入';
            finalTranscript = '';
            interimTranscript = '';
        }

        // 开始录音
        function startRecording() {
            if (!recognition) {
                if (!initSpeechRecognition()) return;
            }
            if (!isRecording) {
                preRecordText = document.getElementById('note-input').value;
                finalTranscript = '';
                interimTranscript = '';
                recordingStartTime = Date.now();
                // 立即设置录音状态，确保按钮释放时能正确停止
                isRecording = true;
                showRecordingState();
                
                try {
                    recognition.start();
                    
                    // 启动定时刷新，每100ms更新一次输入框
                    refreshInterval = setInterval(() => {
                        updateTextareaWithTranscript();
                        
                        // 检查是否超过30秒
                        if (Date.now() - recordingStartTime >= MAX_RECORDING_TIME) {
                            console.log('达到最大录音时间30秒，自动停止');
                            stopRecording();
                        }
                    }, 100);
                    
                } catch (e) {
                    console.error('启动语音识别失败:', e);
                    // 如果已经在运行，先停止再启动
                    try {
                        recognition.stop();
                        setTimeout(() => {
                            recognition.start();
                            refreshInterval = setInterval(() => {
                                updateTextareaWithTranscript();
                                if (Date.now() - recordingStartTime >= MAX_RECORDING_TIME) {
                                    stopRecording();
                                }
                            }, 100);
                        }, 200);
                    } catch (err) {
                        console.error('重启语音识别失败:', err);
                        isRecording = false;
                    }
                }
            }
        }

        // 停止录音
        function stopRecording() {
            isRecording = false;
            
            // 清除定时刷新
            if (refreshInterval) {
                clearInterval(refreshInterval);
                refreshInterval = null;
            }
            
            // 最后一次更新输入框
            updateTextareaWithTranscript();
            
            if (recognition) {
                try {
                    recognition.stop();
                } catch (e) {
                    console.error('停止语音识别失败:', e);
                }
            }
        }

        // 切换标签页
        function showTab(tab) {

            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));
            document.getElementById('btn-' + tab).classList.add('active');
            document.getElementById(tab + '-panel').classList.add('active');
            
            if (tab === 'record') {

                updateBatchActions();

            if (tab === 'review') {

                currentStatusFilter = '全部';
                currentTagFilter = '全部';
                hasTimeFilterSelected = false;

                updateBatchActions();

                document.querySelectorAll('.status-filters .status-btn').forEach(btn => {

        // 提交笔记
        async function submitNote() {
            const content = document.getElementById('note-input').value.trim();
            const messageDiv = document.getElementById('record-message');
            
            if (!content) {
                showMessage(messageDiv, '请输入内容', 'error');
                return;
            }
            
            try {
                const response = await fetch('api/notes', {

                    headers: getHeaders(),

                if (response.ok) {

        function setTimeFilter(type) {
            currentTimeFilter = type;

            document.querySelectorAll('.quick-filters .quick-btn').forEach(btn => btn.classList.remove('active'));

        // 设置状态筛选
        function setStatusFilter(status) {
            currentStatusFilter = status;
            document.querySelectorAll('.status-filters .status-btn').forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            if (hasTimeFilterSelected) {

        // 设置标签筛选
        function setTagFilter(tag) {
            currentTagFilter = tag;
            document.querySelectorAll('.tag-filters .tag-btn').forEach(btn => btn.classList.remove('active'));

        // 获取日期参数
        function getDateRange() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            
            switch(currentTimeFilter) {
                case 'today':
                    return { start: todayStr, end: todayStr };
                case '3days':
                    const threeDaysAgo = new Date(today);
                    threeDaysAgo.setDate(today.getDate() - 2);
                    return { start: threeDaysAgo.toISOString().split('T')[0], end: todayStr };
                case 'week':
                    const weekAgo = new Date(today);
                    weekAgo.setDate(today.getDate() - 6);
                    return { start: weekAgo.toISOString().split('T')[0], end: todayStr };
                case 'all':
                default:
                    return { start: '', end: '' };
            }
        }
        
        // 查询笔记
        async function queryNotes(preserveSelection = false) {
            const notesList = document.getElementById('notes-list');
            const dateRange = getDateRange();
            
            let url = 'api/notes';
            const params = [];
            if (dateRange.start) params.push(`start_date=${dateRange.start}`);
            if (dateRange.end) params.push(`end_date=${dateRange.end}`);
            if (currentStatusFilter && currentStatusFilter !== '全部') {
                params.push(`status=${encodeURIComponent(currentStatusFilter)}`);
            }
            if (currentTagFilter && currentTagFilter !== '全部') {
                params.push(`tag=${encodeURIComponent(currentTagFilter)}`);
            }
            if (params.length > 0) url += '?' + params.join('&');
            
            try {
                const response = await fetch(url, {
                    headers: getHeaders()
                });
                const data = await response.json();
                currentNotes = data.notes;
                if (!preserveSelection) {
                    selectedNotes.clear();
                }
                updateBatchActions();
                
                if (data.notes.length === 0) {
                    notesList.innerHTML = '<p class="empty-tip">没有找到符合条件的笔记</p>';
                    return;
                }
                
                notesList.innerHTML = data.notes.map(note => {
                    const tagsHtml = (note.tags && note.tags.length > 0)
                        ? `<div class="note-tags">${note.tags.map(t => `<span class="note-tag">${escapeHtml(t)}<span class="note-tag-remove" onclick="removeNoteTag('${note.id}', '${escapeHtml(t)}')">×</span></span>`).join('')}</div>`
                        : '';
                    return `
                    <div class="note-item ${note.status === '已处理' ? 'processed' : ''}" data-id="${note.id}">
                        <div class="note-checkbox">
                            <input type="checkbox" onchange="toggleSelect('${note.id}')" ${selectedNotes.has(note.id) ? 'checked' : ''}>
                        </div>
                        <div class="note-content-wrapper">
                            <div class="note-header">
                                <span class="note-time">${note.timestamp}</span>
                                <div class="note-header-right">
                                    <span class="note-status ${note.status === '已处理' ? 'status-processed' : 'status-pending'}">${note.status}</span>
                                    <button class="action-link" onclick="toggleNoteStatus('${note.id}', '${note.status === '已处理' ? '待处理' : '已处理'}')">
                                        ${note.status === '已处理' ? '标记为待处理' : '标记为已处理'}
                                    </button>
                                </div>
                            </div>
                            <div class="note-content">${escapeHtml(note.content)}</div>
                            ${tagsHtml}
                        </div>
                    </div>
                `}).join('');
                // 同步选中状态到 DOM
                selectedNotes.forEach(id => {
                    const el = document.querySelector(`.note-item[data-id="${id}"]`);
                    if (el) el.classList.add('selected');
                });
            } catch (err) {
                notesList.innerHTML = '<p class="empty-tip" style="color: #e74c3c;">查询失败，请重试</p>';
            }
        }
        
        // 切换选择
        function toggleSelect(noteId) {
            const noteEl = document.querySelector(`.note-item[data-id="${noteId}"]`);
            if (selectedNotes.has(noteId)) {
                selectedNotes.delete(noteId);
                if (noteEl) noteEl.classList.remove('selected');
            } else {
                selectedNotes.add(noteId);
                if (noteEl) noteEl.classList.add('selected');
            }
            updateBatchActions();
        }

        function updateBatchActions() {
            const batchActions = document.getElementById('batch-actions');
            const selectedCount = document.getElementById('selected-count');
            selectedCount.textContent = selectedNotes.size;
            batchActions.style.display = selectedNotes.size > 0 ? 'flex' : 'none';
        }
        
        // 取消批量选择
        function cancelBatch() {

            queryNotes();
        }
        
        // 切换单条笔记状态
        async function toggleNoteStatus(noteId, newStatus) {
            try {
                const response = await fetch(`api/notes/${noteId}/status`, {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify({ status: newStatus })
                });

                }
            } catch (err) {
                alert('网络错误，请重试');

        }
        
        // 批量设置状态
        async function batchSetStatus(newStatus) {
            if (selectedNotes.size === 0) return;
            try {
                const response = await fetch('api/notes/batch/status', {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify({ ids: Array.from(selectedNotes), status: newStatus })
                });
                if (response.ok) {
                    selectedNotes.clear();
                    queryNotes();
                } else {
                    alert('批量更新失败，请重试');
                }
            } catch (err) {
                alert('网络错误，请重试');

        // 从单条笔记删除标签
        async function removeNoteTag(noteId, tag) {
            try {
                const response = await fetch(`api/notes/${noteId}/tag`, {
                    method: 'DELETE',
                    headers: getHeaders(),
                    body: JSON.stringify({ tag })
                });
                if (response.ok) {
                    queryNotes(true);
                } else {
                    alert('删除标签失败');
                }
            } catch (err) {
                alert('网络错误，请重试');
            }
        }

        // 批量添加标签 - 下拉菜单
        function toggleBatchTagDropdown(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('batch-tag-dropdown');
            if (!dropdown.classList.contains('show')) {
                renderBatchTagDropdown();
            }
            dropdown.classList.toggle('show');
        }

        // 点击页面其他地方关闭批量标签下拉
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('batch-tag-dropdown');
            if (dropdown && dropdown.classList.contains('show')) {
                if (!e.target.closest('.batch-tag-dropdown-wrapper')) {
                    dropdown.classList.remove('show');
                }
            }
        });

        // 渲染批量标签下拉菜单
        function renderBatchTagDropdown() {
            const dropdown = document.getElementById('batch-tag-dropdown');
            if (existingTags.length === 0) {
                dropdown.innerHTML = '<p class="batch-tag-empty">暂无标签</p>';
                return;
            }
            dropdown.innerHTML = existingTags.map(tag => `
                <label class="batch-tag-item">
                    <input type="checkbox" value="${escapeHtml(tag)}">
                    <span>${escapeHtml(tag)}</span>
                </label>
            `).join('') + `<button class="batch-tag-confirm-btn" onclick="batchAddTags()">确认添加</button>`;
        }

        // 执行批量添加标签
        async function batchAddTags() {
            const checkedTags = Array.from(document.querySelectorAll('#batch-tag-dropdown input[type="checkbox"]:checked'))
                .map(cb => cb.value);
            if (checkedTags.length === 0) {
                alert('请至少选择一个标签');
                return;
            }
            if (selectedNotes.size === 0) return;
            try {
                const response = await fetch('api/notes/batch/tags', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ ids: Array.from(selectedNotes), tags: checkedTags })
                });
                const data = await response.json();
                if (response.ok) {
                    document.getElementById('batch-tag-dropdown').classList.remove('show');
                    queryNotes(true);
                    loadExistingTags();
                } else {
                    alert(data.error || '添加标签失败');
                }
            } catch (err) {
                alert('网络错误，请重试');
            }
        }

        // 批量删除
        async function batchDelete() {
            if (selectedNotes.size === 0) return;
            if (!confirm(`确定要删除选中的 ${selectedNotes.size} 条想法吗？`)) return;
            
            try {
                const response = await fetch('api/notes/batch', {
                    method: 'DELETE',
                    headers: getHeaders(),
                    body: JSON.stringify({ ids: Array.from(selectedNotes) })
                });
                if (response.ok) {
                    selectedNotes.clear();
                    queryNotes();
                } else {
                    alert('删除失败，请重试');
                }
            } catch (err) {
                alert('网络错误，请重试');
            }
        }
        
        // 显示消息
        function showMessage(element, text, type) {
            element.textContent = text;
            element.className = 'message ' + type;
            setTimeout(() => {
                element.textContent = '';
                element.className = 'message';
            }, 3000);
        }
        
        // ==================== 标签管理（记录页） ====================
        
        // 加载当前用户已有标签
        async function loadExistingTags() {
            try {
                const response = await fetch('api/tags', { headers: getHeaders() });
                const data = await response.json();
                if (response.ok) {
                    existingTags = data.tags || [];
                    renderTagDropdown();
                }
            } catch (err) {
                console.error('加载标签失败:', err);
            }
        }
        
        // 渲染标签下拉复选框
        function renderTagDropdown() {
            const dropdown = document.getElementById('tag-dropdown');
            if (existingTags.length === 0) {
                dropdown.innerHTML = '<p class="tag-dropdown-empty">暂无标签</p>';
                return;
            }
            dropdown.innerHTML = existingTags.map(tag => `
                <label class="tag-dropdown-item">
                    <input type="checkbox" value="${escapeHtml(tag)}" ${selectedTags.has(tag) ? 'checked' : ''} onchange="toggleTagFromDropdown('${escapeHtml(tag)}', this.checked)">
                    <span>${escapeHtml(tag)}</span>
                </label>
            `).join('');
        }
        
        // 切换下拉框显示/隐藏
        function toggleTagDropdown(e) {
            e.stopPropagation();
            const dropdown = document.getElementById('tag-dropdown');
            dropdown.classList.toggle('show');
        }
        
        // 点击页面其他地方关闭下拉
        document.addEventListener('click', function(e) {
            const dropdown = document.getElementById('tag-dropdown');
            if (dropdown && dropdown.classList.contains('show')) {
                if (!e.target.closest('.tag-dropdown-wrapper')) {
                    dropdown.classList.remove('show');
                }
            }
        });
        
        // 从下拉框勾选/取消标签
        function toggleTagFromDropdown(tag, checked) {
            if (checked) {
                selectedTags.add(tag);
            } else {
                selectedTags.delete(tag);
            }
            renderSelectedTags();
        }
        
        // 输入框按键处理（回车添加标签）
        function handleTagInputKeydown(e) {
            if (e.key === 'Enter') {
                e.preventDefault();
                addTagFromInput();
            }
        }
        
        // 输入框内容变化时，显示/隐藏"添加"按钮
        function onTagInputChange() {
            const input = document.getElementById('tag-input');
            const addBtn = document.getElementById('tag-add-btn');
            if (input.value.trim()) {
                addBtn.classList.add('show');
            } else {
                addBtn.classList.remove('show');
            }
        }
        
        // 从输入框添加标签
        function addTagFromInput() {
            const input = document.getElementById('tag-input');
            const tag = input.value.trim();
            if (tag) {
                addTag(tag);
                input.value = '';
                document.getElementById('tag-add-btn').classList.remove('show');
            }
        }
        
        // 添加标签（防重复，实时更新标签库，持久化到服务器）
        function addTag(tag) {
            tag = tag.trim();
            if (!tag) return;
            // 防重复：忽略大小写比较
            for (let t of selectedTags) {
                if (t.toLowerCase() === tag.toLowerCase()) return;
            }
            selectedTags.add(tag);
            // 如果是新标签，加入已有标签库（实时显示在下拉和回顾页）
            let isNew = true;
            for (let t of existingTags) {
                if (t.toLowerCase() === tag.toLowerCase()) { isNew = false; break; }
            }
            if (isNew) {
                existingTags.push(tag);
                existingTags.sort();
                renderTagDropdown();
                updateReviewTagFilters();
                // 持久化到服务器
                fetch('api/tags', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ tag })
                }).catch(err => console.error('保存标签失败:', err));
            }
            renderSelectedTags();
            renderTagDropdown();
        }
        
        // 移除已选标签
        function removeTag(tag) {
            selectedTags.delete(tag);
            renderSelectedTags();
            renderTagDropdown();
        }
        
        // 渲染已选标签 chips
        function renderSelectedTags() {
            const container = document.getElementById('selected-tags');
            if (selectedTags.size === 0) {
                container.innerHTML = '';
                return;
            }
            container.innerHTML = Array.from(selectedTags).map(tag => `
                <span class="tag-chip">
                    ${escapeHtml(tag)}
                    <span class="tag-chip-remove" onclick="removeTag('${escapeHtml(tag)}')">×</span>
                </span>
            `).join('');
        }
        
        // ==================== 标签筛选（回顾页） ====================
        
        // 加载回顾页标签筛选按钮
        async function loadReviewTagFilters() {
            try {
                const response = await fetch('api/tags', { headers: getHeaders() });
                const data = await response.json();
                existingTags = data.tags || [];
                renderReviewTagFilters();
            } catch (err) {
                console.error('加载标签筛选失败:', err);
            }
        }
        
        // 实时更新回顾页标签筛选按钮（用已有标签数据）
        function updateReviewTagFilters() {
            renderReviewTagFilters();
        }
        
        // 渲染回顾页标签筛选按钮
        function renderReviewTagFilters() {
            const container = document.getElementById('tag-filters');
            if (!container) return;
            let html = `<button class="tag-btn ${currentTagFilter === '全部' ? 'active' : ''}" onclick="setTagFilter('全部')">全部</button>`;
            html += existingTags.map(tag => 
                `<button class="tag-btn ${currentTagFilter === tag ? 'active' : ''}" onclick="setTagFilter('${escapeHtml(tag)}')">${escapeHtml(tag)}</button>`
            ).join('');
            container.innerHTML = html;
        }
        
        // ==================== 导出功能 ====================
        
        let exportTimeRange = 'all';
        
        // 设置导出时间范围
        function setExportTimeRange(range, btn) {
            exportTimeRange = range;
            if (btn) {
                document.querySelectorAll('.export-time-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            } else {
                // 自定义天数输入
                document.querySelectorAll('.export-time-btn').forEach(b => b.classList.remove('active'));
            }
            updateExportPreview();
        }
        
        // 计算导出日期范围
        function getExportDateRange() {
            const today = new Date();
            const todayStr = today.toISOString().split('T')[0];
            switch (exportTimeRange) {
                case 'today':
                    return { start: todayStr, end: todayStr };
                case '3days': {
                    const d = new Date(today);
                    d.setDate(today.getDate() - 2);
                    return { start: d.toISOString().split('T')[0], end: todayStr };
                }
                case 'week': {
                    const d = new Date(today);
                    d.setDate(today.getDate() - 6);
                    return { start: d.toISOString().split('T')[0], end: todayStr };
                }
                case 'custom': {
                    const days = parseInt(document.getElementById('export-custom-days').value) || 1;
                    const d = new Date(today);
                    d.setDate(today.getDate() - (days - 1));
                    return { start: d.toISOString().split('T')[0], end: todayStr };
                }
                case 'all':
                default:
                    return { start: '', end: '' };
            }
        }
        
        // 获取当前选择的标签参数
        function getExportTagsParam() {
            const allCheckbox = document.querySelector('#export-tags-list input[value="all"]');
            if (!allCheckbox || allCheckbox.checked) return 'all';
            const selectedExportTags = Array.from(document.querySelectorAll('#export-tags-list input[type="checkbox"]'))
                .filter(cb => cb.value !== 'all' && cb.checked)
                .map(cb => cb.value);
            return selectedExportTags.length > 0 ? selectedExportTags.join(',') : 'all';
        }
        
        // 实时更新导出预览条数
        let exportPreviewTimer = null;
        function updateExportPreview() {
            clearTimeout(exportPreviewTimer);
            exportPreviewTimer = setTimeout(async () => {
                const dateRange = getExportDateRange();
                const tagsParam = getExportTagsParam();
                const params = [];
                if (dateRange.start) params.push(`start_date=${dateRange.start}`);
                if (dateRange.end) params.push(`end_date=${dateRange.end}`);
                params.push(`tags=${encodeURIComponent(tagsParam)}`);
                const previewEl = document.getElementById('export-preview');
                previewEl.textContent = '计算中...';
                try {
                    const response = await fetch('api/export/preview?' + params.join('&'), { headers: getHeaders() });
                    const data = await response.json();
                    if (response.ok) {
                        previewEl.textContent = `将导出 ${data.count} 条记录`;
                    } else {
                        previewEl.textContent = '获取条数失败';
                    }
                } catch (err) {
                    previewEl.textContent = '网络错误';
                }
            }, 200);
        }
        
        // 打开导出弹窗
        async function openExportModal() {
            exportTimeRange = 'all';
            document.querySelectorAll('.export-time-btn').forEach(b => b.classList.remove('active'));
            document.querySelector('.export-time-btn[data-range="all"]').classList.add('active');
            document.getElementById('export-custom-days').value = '';
            // 加载标签列表
            try {
                const response = await fetch('api/tags', { headers: getHeaders() });
                const data = await response.json();
                const tags = data.tags || [];
                const container = document.getElementById('export-tags-list');
                let html = '<label class="export-tag-item"><input type="checkbox" value="all" checked onchange="onExportTagAllChange(); updateExportPreview()"> 全部</label>';
                html += tags.map(tag => 
                    `<label class="export-tag-item"><input type="checkbox" value="${escapeHtml(tag)}" onchange="onExportTagItemChange(); updateExportPreview()"> ${escapeHtml(tag)}</label>`
                ).join('');
                container.innerHTML = html;
            } catch (err) {
                console.error('加载标签失败:', err);
            }
            document.getElementById('export-modal').style.display = 'flex';
            updateExportPreview();
        }
        
        // 关闭导出弹窗
        function closeExportModal() {
            document.getElementById('export-modal').style.display = 'none';
        }
        
        // "全部"复选框变化
        function onExportTagAllChange() {
            const allCheckbox = document.querySelector('#export-tags-list input[value="all"]');
            const isChecked = allCheckbox.checked;
            document.querySelectorAll('#export-tags-list input[type="checkbox"]').forEach(cb => {
                if (cb.value !== 'all') {
                    cb.checked = false;
                    cb.disabled = isChecked;
                }
            });
        }
        
        // 单个标签复选框变化
        function onExportTagItemChange() {
            const allCheckbox = document.querySelector('#export-tags-list input[value="all"]');
            const anyItemChecked = Array.from(document.querySelectorAll('#export-tags-list input[type="checkbox"]'))
                .some(cb => cb.value !== 'all' && cb.checked);
            allCheckbox.checked = !anyItemChecked;
        }
        
        // 执行导出
        async function doExport() {
            const dateRange = getExportDateRange();
            const tagsParam = getExportTagsParam();
            
            if (tagsParam === 'all') {
                // "全部"已选中，无需检查
            } else {
                const selectedExportTags = Array.from(document.querySelectorAll('#export-tags-list input[type="checkbox"]'))
                    .filter(cb => cb.value !== 'all' && cb.checked)
                    .map(cb => cb.value);
                if (selectedExportTags.length === 0) {
                    alert('请至少选择一个标签，或选择"全部"');
                    return;
                }
            }
            
            const params = [];
            if (dateRange.start) params.push(`start_date=${dateRange.start}`);
            if (dateRange.end) params.push(`end_date=${dateRange.end}`);
            params.push(`tags=${encodeURIComponent(tagsParam)}`);
            
            try {
                const response = await fetch('api/export?' + params.join('&'), { headers: getHeaders() });
                const data = await response.json();
                if (response.ok) {
                    // 触发下载
                    const blob = new Blob([data.content], { type: 'text/markdown;charset=utf-8' });
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.filename;
                    document.body.appendChild(a);
                    a.click();
                    document.body.removeChild(a);
                    URL.revokeObjectURL(url);
                    closeExportModal();
                    alert('导出成功！');
                } else {
                    alert(data.error || '导出失败');
                }
            } catch (err) {
                alert('网络错误，导出失败');
            }
        }
        
        // ==================== 导入功能 ====================
        
        async function handleImport(event) {
            const file = event.target.files[0];
            if (!file) return;
            
            if (!confirm(`确定要导入文件「${file.name}」吗？\n导入的笔记时间将记为当前时间，状态为已处理。`)) {
                event.target.value = '';
                return;
            }
            
            try {
                const content = await file.text();
                const response = await fetch('api/import', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ content })
                });
                const data = await response.json();
                if (response.ok) {
                    alert(data.message);
                    // 如果当前在回顾页，刷新
                    if (hasTimeFilterSelected) {
                        queryNotes();
                    }
                    loadExistingTags();
                } else {
                    alert(data.error || '导入失败');
                }
            } catch (err) {
                alert('网络错误，导入失败');
            }
            event.target.value = '';
        }
        
        // ==================== 标签管理弹窗 ====================
        
        // 打开标签管理弹窗
        async function openTagManageModal() {
            document.getElementById('tag-manage-new-input').value = '';
            await loadExistingTags();
            renderTagManageList();
            document.getElementById('tag-manage-modal').style.display = 'flex';
        }
        
        // 关闭标签管理弹窗
        function closeTagManageModal() {
            document.getElementById('tag-manage-modal').style.display = 'none';
        }
        
        // 渲染标签管理列表
        function renderTagManageList() {
            const list = document.getElementById('tag-manage-list');
            if (existingTags.length === 0) {
                list.innerHTML = '<p class="empty-tip">暂无标签</p>';
                return;
            }
            list.innerHTML = existingTags.map(tag => `
                <div class="tag-manage-item">
                    <span class="tag-manage-item-name">${escapeHtml(tag)}</span>
                    <div class="tag-manage-item-actions">
                        <button class="tag-manage-action-btn rename" onclick="tagManageRename('${escapeHtml(tag)}')">重命名</button>
                        <button class="tag-manage-action-btn delete" onclick="tagManageDelete('${escapeHtml(tag)}')">删除</button>
                    </div>
                </div>
            `).join('');
        }
        
        // 新增标签
        async function tagManageAdd() {
            const input = document.getElementById('tag-manage-new-input');
            const tag = input.value.trim();
            if (!tag) return;
            try {
                const response = await fetch('api/tags', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ tag })
                });
                if (response.ok) {
                    input.value = '';
                    await loadExistingTags();
                    renderTagManageList();
                    updateReviewTagFilters();
                    renderTagDropdown();
                } else {
                    const data = await response.json();
                    alert(data.error || '添加失败');
                }
            } catch (err) {
                alert('网络错误，请重试');
            }
        }
        
        // 重命名标签
        async function tagManageRename(oldTag) {
            const newTag = prompt(`将标签「${oldTag}」重命名为：`, oldTag);
            if (!newTag || newTag.trim() === oldTag) return;
            try {
                const response = await fetch('api/tags/rename', {
                    method: 'PUT',
                    headers: getHeaders(),
                    body: JSON.stringify({ old_tag: oldTag, new_tag: newTag.trim() })
                });
                const data = await response.json();
                if (response.ok) {
                    await loadExistingTags();
                    renderTagManageList();
                    updateReviewTagFilters();
                    renderTagDropdown();
                    if (hasTimeFilterSelected) queryNotes(true);
                    alert(data.message);
                } else {
                    alert(data.error || '重命名失败');
                }
            } catch (err) {
                alert('网络错误，请重试');
            }
        }
        
        // 删除标签
        async function tagManageDelete(tag) {
            try {
                // 先尝试不带 force
                const response = await fetch('api/tags/delete', {
                    method: 'POST',
                    headers: getHeaders(),
                    body: JSON.stringify({ tag, force: false })
                });
                const data = await response.json();
                
                if (response.status === 409 && data.need_confirm) {
                    // 有笔记使用，需确认
                    if (confirm(`标签「${tag}」被 ${data.note_count} 条笔记使用，删除后将同时从这些笔记中移除该标签。确认删除？`)) {
                        const response2 = await fetch('api/tags/delete', {
                            method: 'POST',
                            headers: getHeaders(),
                            body: JSON.stringify({ tag, force: true })
                        });
                        const data2 = await response2.json();
                        if (response2.ok) {
                            await loadExistingTags();
                            renderTagManageList();
                            updateReviewTagFilters();
                            renderTagDropdown();
                            if (hasTimeFilterSelected) queryNotes(true);
                            alert(data2.message);
                        } else {
                            alert(data2.error || '删除失败');
                        }
                    }
                } else if (response.ok) {
                    await loadExistingTags();
                    renderTagManageList();
                    updateReviewTagFilters();
                    renderTagDropdown();
                    if (hasTimeFilterSelected) queryNotes(true);
                    alert(data.message);
                } else {
                    alert(data.error || '删除失败');
                }
            } catch (err) {
                alert('网络错误，请重试');
            }
        }
        
        // ==================== 设置弹窗 ====================
        
        let selectedTimeoutSeconds = DEFAULT_TIMEOUT;
        
        // 打开设置弹窗
        function openSettingsModal() {
            selectedTimeoutSeconds = getTimeoutSeconds();
            // 重置按钮状态
            document.querySelectorAll('.settings-timeout-btn').forEach(btn => btn.classList.remove('active'));
            document.getElementById('settings-custom-value').value = '';
            document.getElementById('settings-custom-unit').value = '3600';
            // 检查是否匹配预设
            const presetBtn = document.querySelector(`.settings-timeout-btn[data-value="${selectedTimeoutSeconds}"]`);
            if (presetBtn) {
                presetBtn.classList.add('active');
            } else {
                // 自定义值，回填输入框
                const unitSelect = document.getElementById('settings-custom-unit');
                const units = [{v: 86400, n: '天'}, {v: 3600, n: '小时'}, {v: 60, n: '分钟'}];
                for (let u of units) {
                    if (selectedTimeoutSeconds % u.v === 0) {
                        document.getElementById('settings-custom-value').value = selectedTimeoutSeconds / u.v;
                        unitSelect.value = u.v;
                        break;
                    }
                }
            }
            updateCurrentTimeoutDisplay();
            document.getElementById('settings-modal').style.display = 'flex';
        }
        
        // 关闭设置弹窗
        function closeSettingsModal() {
            document.getElementById('settings-modal').style.display = 'none';
        }
        
        // 选择预设超时
        function selectTimeoutPreset(btn) {
            document.querySelectorAll('.settings-timeout-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            selectedTimeoutSeconds = parseInt(btn.dataset.value);
            document.getElementById('settings-custom-value').value = '';
            updateCurrentTimeoutDisplay();
        }
        
        // 自定义超时输入
        function selectTimeoutCustom() {
            document.querySelectorAll('.settings-timeout-btn').forEach(b => b.classList.remove('active'));
            const value = parseInt(document.getElementById('settings-custom-value').value);
            const unit = parseInt(document.getElementById('settings-custom-unit').value);
            if (value && value > 0 && unit) {
                selectedTimeoutSeconds = value * unit;
            }
            updateCurrentTimeoutDisplay();
        }
        
        // 显示当前选择的超时时间
        function updateCurrentTimeoutDisplay() {
            const seconds = selectedTimeoutSeconds;
            let text;
            if (seconds % 86400 === 0) {
                text = `${seconds / 86400} 天`;
            } else if (seconds % 3600 === 0) {
                text = `${seconds / 3600} 小时`;
            } else if (seconds % 60 === 0) {
                text = `${seconds / 60} 分钟`;
            } else {
                text = `${seconds} 秒`;
            }
            document.getElementById('settings-current-timeout').textContent = '当前设置：' + text;
        }
        
        // 保存设置
        function saveSettings() {
            const openid = localStorage.getItem('openid');
            if (!openid) return;
            localStorage.setItem('timeout_' + openid, selectedTimeoutSeconds.toString());
            // 更新登录时间，使新设置立即生效
            localStorage.setItem('loginTime', Date.now().toString());
            closeSettingsModal();
            alert('设置已保存');
        }
        
        // HTML转义
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
    </script>
</body>
</html>
